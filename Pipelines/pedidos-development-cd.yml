trigger: none

parameters:
  - name: imageTag
    type: string
    default: 'Pedidos-Development-latest'

variables:
  - group: Pedidos

jobs:
- job: DeployPedidosDevelopment
  displayName: Deploy para Desenvolvimento
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  pool:
    vmImage: 'ubuntu-latest'
  steps:
    - task: AzureCLI@2
      displayName: Deploy da Pedidos.Api no Azure Container Instances
      inputs:
        azureSubscription: 'fcgrm-connection'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Iniciando deploy do pedidos-development no ACI..."

          az container delete \
            --resource-group FCG-RG \
            --name pedidos-development \
            --yes

          az container create \
            --resource-group FCG-RG \
            --name pedidos-development \
            --image fcgcr.azurecr.io/fcgcr-repo:${{ parameters.imageTag }} \
            --dns-name-label pedidos-development-$(Build.BuildId) \
            --ports 80 \
            --location eastus \
            --os-type Linux \
            --cpu 1 \
            --memory 1.5 \
            --registry-login-server fcgcr.azurecr.io \
            --registry-username "${ACR_USERNAME}" \
            --registry-password "${ACR_PASSWORD}" \
            --environment-variables \
                DOTNET_ENVIRONMENT=Development \
                ConnectionStrings__DefaultConnection="${CONN_STR}" \
                JwtSettings__SecretKey="${JWT_SECRET}" \
                JwtSettings__Issuer="${JWT_ISSUER}" \
                JwtSettings__Audience="${JWT_AUDIENCE}" \
                JwtSettings__ExpirationMinutes="${JWT_EXPIRATION}" \
                EmailSettings__SmtpUser="${SMTP_USER}" \
                EmailSettings__SmtpPassword="${SMTP_PASS}" \
                EmailSettings__SmtpServer="${SMTP_SERVER}" \
                EmailSettings__SmtpPort="${SMTP_PORT}" \
                ApplicationInsights__ConnectionString="${APPINSIGHTS_CONN}" \
                ApplicationInsights__EnableDebugLogger="${APPINSIGHTS_DEBUG}" \
                ApplicationInsights__EnableAdaptiveSampling="${APPINSIGHTS_SAMPLING}" \
                Elasticsearch__UseCloud="${ELASTIC_USECLOUD}" \
                Elasticsearch__Uri="${ELASTIC_URI}" \
                Elasticsearch__DefaultIndex="${ELASTIC_INDEX}" \
                Elasticsearch__Username="${ELASTIC_USER}" \
                Elasticsearch__Password="${ELASTIC_PASS}" \
                Logging__LogLevel__Default="${LOG_DEFAULT}" \
                Logging__LogLevel__Microsoft="${LOG_MICROSOFT}" \
                Logging__LogLevel__Microsoft_ApplicationInsights="${LOG_MICROSOFT_AI}" \
                Logging__LogLevel__Microsoft_Hosting_Lifetime="${LOG_MICROSOFT_LIFETIME}" \
                Messaging__Provider="${MSG_PROVIDER}" \
                RabbitMQ__HostName="${RABBIT_HOST}" \
                RabbitMQ__UserName="${RABBIT_USER}" \
                RabbitMQ__Password="${RABBIT_PASS}" \
                RabbitMQ__ConnectionName="${RABBIT_CONN}" \
                RabbitMQ__Queues__PagamentoRealizadoEvent="${RABBIT_QUEUE_PAGAMENTO}" \
                ServiceBus__ConnectionString="${SB_CONN}" \
                ServiceBus__Queues__PagamentoRealizadoEvent="${SB_QUEUE_PAGAMENTO}"
            --output json

          echo "Verificando se o container foi criado..."
          az container show \
            --resource-group FCG-RG \
            --name pedidos-development \
            --query "{name:name, state:instanceView.state}" \
            --output json
      env:
          ACR_USERNAME: $(acrUsername)
          ACR_PASSWORD: $(acrPassword)
          CONN_STR: $(ConnectionStrings__DefaultConnection)
          JWT_SECRET: $(JwtSettings__SecretKey)
          JWT_ISSUER: $(JwtSettings__Issuer)
          JWT_AUDIENCE: $(JwtSettings__Audience)
          JWT_EXPIRATION: $(JwtSettings__ExpirationMinutes)
          SMTP_USER: $(EmailSettings__SmtpUser)
          SMTP_PASS: $(EmailSettings__SmtpPassword)
          SMTP_SERVER: $(EmailSettings__SmtpServer)
          SMTP_PORT: $(EmailSettings__SmtpPort)
          APPINSIGHTS_CONN: $(ApplicationInsights__ConnectionString)
          APPINSIGHTS_DEBUG: $(ApplicationInsights__EnableDebugLogger)
          APPINSIGHTS_SAMPLING: $(ApplicationInsights__EnableAdaptiveSampling)
          ELASTIC_USECLOUD: $(Elasticsearch__UseCloud)
          ELASTIC_URI: $(Elasticsearch__Uri)
          ELASTIC_INDEX: $(Elasticsearch__DefaultIndex)
          ELASTIC_USER: $(Elasticsearch__Username)
          ELASTIC_PASS: $(Elasticsearch__Password)
          LOG_DEFAULT: $(Logging__LogLevel__Default)
          LOG_MICROSOFT: $(Logging__LogLevel__Microsoft)
          LOG_MICROSOFT_AI: $(Logging__LogLevel__Microsoft.ApplicationInsights)
          LOG_MICROSOFT_LIFETIME: $(Logging__LogLevel__Microsoft.Hosting.Lifetime)
          MSG_PROVIDER: $(Messaging__Provider)
          RABBIT_HOST: $(RabbitMQ__HostName)
          RABBIT_USER: $(RabbitMQ__UserName)
          RABBIT_PASS: $(RabbitMQ__Password)
          RABBIT_CONN: $(RabbitMQ__ConnectionName)
          RABBIT_QUEUE_PAGAMENTO: $(RabbitMQ__Queues__PagamentoRealizadoEvent)
          SB_CONN: $(ServiceBus__ConnectionString)
          SB_QUEUE_PAGAMENTO: $(ServiceBus__Queues__PagamentoRealizadoEvent)